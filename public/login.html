<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Iniciar sesión</title>
</head>
<body>
    <header class="header">
        <input type="checkbox" class="header__checkbox" id="open-menu">
        <label for="open-menu" class="header__nav-toggle">=</label>
        <div class="header__logo-container">
            <img class="header__logo" src="Imagenes/Logo-Clubdelibros.png" alt="Logo del club de libros">
        </div>

        <nav class="header__nav">
            <ul class="header__nav-list">
                <li class="header__nav-item"><a href="index.html">Inicio</a></li>
                <li class="header__nav-item"><a href="genero.html">Genero</a></li>
                <li class="header__nav-item"><a href="editorial.html">Editorial</a></li>
                <li class="header__nav-item"><a href="authors.html">Autores</a></li>
                <li class="header__nav-item"><a href="nosotros.html">Nosotros</a></li>
                <li class="header__nav-item header__nav-item--auth"><a href="login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <h1 class="auth-section__title">Iniciar sesión</h1>

            <form class="auth-form" id="login-form">
    <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit" class="auth-form__submit">Entrar</button>
</form>

            <p class="auth-section__redirect">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__content">
            <p class="footer__text">© 2025 Club de libros. Todos los derechos reservados.</p>
            <ul class="footer__links">
                <li><a href="#">Sobre el blog</a></li>
                <li><a href="#">Política de privacidad</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </div>
    </footer>

    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
